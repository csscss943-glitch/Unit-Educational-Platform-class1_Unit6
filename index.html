:root{
  --bg:#0a1931;
  --surface:#12294d;
  --surface-2:#173763;
  --surface-3:#1e4170;
  --line:#2b4f7e;
  --text:#ffffff;
  --muted:#cbd8ec;
  --yellow:#ffe14d;
  --yellow-2:#ffd93b;
  --green:#2ee66b;
  --green-bg:#0f3d26;
  --red:#ff5a6a;
  --red-bg:#4a1620;
  --blue:#4da8ff;
  --orange:#ffb020;
  --safe-area-inset-top: env(safe-area-inset-top, 0px);
}
*{
  box-sizing:border-box
}
html{
  scroll-behavior:smooth
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:'Cairo','Tajawal',system-ui,-apple-system,Segoe UI,sans-serif
}
button,input,textarea,select{
  font-family:inherit
}
::-webkit-scrollbar{
  height:10px;
  width:10px
}
::-webkit-scrollbar-thumb{
  background:#2b4f7e;
  border-radius:99px
}
.formula{
  background:#fff3a6;
  color:#0a1931;
  font-weight:900;
  padding:3px 12px;
  border-radius:10px;
  display:inline-block;
  line-height:1.7;
  white-space:nowrap
}
.formula-dark{
  background:rgba(255,225,77,.16);
  border:1px solid #ffe14d;
  color:#ffe14d;
  font-weight:800;
  padding:2px 10px;
  border-radius:999px;
  display:inline-block
}
.chip{
  border:1px solid var(--line);
  background:rgba(255,255,255,.06)
}
.lesson-tab{
  transition:.18s
}
.lesson-tab.active{
  background:var(--yellow);
  color:#0a1931;
  border-color:var(--yellow);
  box-shadow:0 10px 30px rgba(255,225,77,.22)
}
.mcq-btn{
  transition:.15s
}
.mcq-btn:hover{
  border-color:#fff;
  transform:translateY(-1px)
}
.correct{
  border-color:var(--green)!important;
  background:#0f3d26!important;
  color:#fff!important
}
.wrong{
  border-color:var(--red)!important;
  background:#4a1620!important;
  color:#fff!important
}
input[type=number],input[type=text],select,textarea{
  background:#081426;
  border:1px solid var(--line);
  color:#fff;
  outline:none
}
input:focus,textarea:focus,select:focus{
  border-color:var(--yellow)
}
details summary{
  cursor:pointer;
  list-style:none
}
details summary::-webkit-details-marker{
  display:none
}
.first\:rounded-r-2xl:first-child {
  border-top-right-radius: 1rem;
  border-bottom-right-radius: 1rem;
}
.last\:rounded-l-2xl:last-child {
  border-top-left-radius: 1rem;
  border-bottom-left-radius: 1rem;
}
.hover\:text-white:hover {
  --tw-text-opacity: 1;
